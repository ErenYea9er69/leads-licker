[project]
name = "leads-licker"
version = "3.4.0"
description = "A small AI company for customer discovery. You talk to the CEO. Specialists find people with the problem you solve in public communities and draft honest replies in your voice. Every output is verified. MCP server, CLI and API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Neo Reid"}]
keywords = [
    "ai-agent", "multi-agent", "mcp", "customer-discovery", "lead-generation",
    "community-marketing", "claude-code", "cursor", "verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "mcp>=1.27,<3",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

youtube = [
    "youtube-transcript-api>=1.0,<2",
]

dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/ErenYea9er69/leads-licker"
Repository = "https://github.com/ErenYea9er69/leads-licker"
Issues = "https://github.com/ErenYea9er69/leads-licker/issues"

[project.scripts]
leads-licker = "agent_reach.cli:main"
agent-reach = "agent_reach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_reach"]

# The skill pack ships inside the wheel. skillpack.py looks for agent_reach/skillpack.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "agent_reach/skillpack"

[tool.hatch.build.targets.sdist]
include = ["agent_reach", "skills", "scripts", "tests", "docs", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
